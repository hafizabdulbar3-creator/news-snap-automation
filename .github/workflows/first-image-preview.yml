name: NEWS SNAP First Image Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip Pillow langdetect

      - name: Collect news
        run: python test.py

      - name: Classify first batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python classify.py

      - name: Select one article
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          articles = json.loads(
              Path("discovery.json").read_text(encoding="utf-8")
          )

          result = json.loads(
              Path("classified_sample.json").read_text(encoding="utf-8")
          )

          classifications = {
              item["id"]: item
              for item in result.get("results", [])
          }

          selected = None

          for index, article in enumerate(articles[:50], start=1):
              classification = classifications.get(index)

              if classification and classification.get("importance") == "MAJOR":
                  selected = {
                      **article,
                      "classification": classification
                  }
                  break

          if selected is None:
              for index, article in enumerate(articles[:50], start=1):
                  classification = classifications.get(index)

                  if classification and classification.get("importance") == "NORMAL":
                      selected = {
                          **article,
                          "classification": classification
                      }
                      break

          if selected is None and articles:
              selected = {
                  **articles[0],
                  "classification": classifications.get(1, {})
              }

          if selected is None:
              raise RuntimeError("No article available.")

          Path("selected_article.json").write_text(
              json.dumps(selected, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("SELECTED ARTICLE:")
          print(json.dumps(selected, ensure_ascii=False, indent=2))
          PY

      - name: Generate English-only post content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python post_generator.py

      - name: Generate Format 05 image
        env:
          NEWS_SNAP_TEST_MODE: "1"
          NEWS_SNAP_FORCE_TEMPLATE: "05"
        run: python generate_image.py

      - name: Show generated content
        run: cat post.json

      - name: Save first image as artifact
        uses: actions/upload-artifact@v7
        with:
          name: news-snap-first-image-preview
          path: |
            news_snap_post.jpg
            post.json
            selected_article.json
          if-no-files-found: error
