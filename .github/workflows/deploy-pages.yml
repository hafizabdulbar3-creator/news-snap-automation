name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'privacy.html'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp privacy.html _site/privacy.html
          if [ -f news_snap_post.jpg ]; then
            cp news_snap_post.jpg _site/news_snap_post.jpg
          fi
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>NEWS SNAP — Latest Publication</title>
            <style>
              body { background: #08101c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; text-align: center; }
              img { max-width: 100%; max-height: 70vh; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); margin-bottom: 15px; }
              h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #ffcf2d; }
              p { color: #8fa0b5; font-size: 0.9rem; margin-bottom: 10px; }
              a { color: #38bdf8; text-decoration: none; font-weight: 500; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>NEWS SNAP — Latest Publication</h1>
            <img src="news_snap_post.jpg" alt="NEWS SNAP Latest Post" onerror="this.style.display='none'">
            <p>Automated Instagram publication asset hosted via GitHub Pages.</p>
            <p style="margin-top: 15px;"><a href="privacy.html">Privacy Policy &amp; Data Deletion Instructions</a></p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
