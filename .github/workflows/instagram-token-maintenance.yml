name: NEWS SNAP Instagram Token Maintenance

# Automated daily maintenance for Instagram User Access Tokens (Instagram Login API).
# Refreshes long-lived tokens before expiration and updates the repository secret.
#
# Safety Guarantees:
# - NEVER publishes anything to Instagram.
# - NEVER prints access tokens, encrypted payloads, or authorization headers in logs.
# - Runs daily on a non-top-of-hour schedule (03:37 UTC).
# - Uses GH_SECRETS_WRITE_TOKEN if configured to update INSTAGRAM_ACCESS_TOKEN.
# - Opens/updates a single GitHub issue for persistent actionable alerts.

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:37 UTC (non-top-of-hour)
    - cron: "37 3 * * *"

concurrency:
  group: instagram-token-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  token-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest branch state
        run: |
          git pull origin main --rebase || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyNaCl for secret encryption
        run: |
          python -m pip install --upgrade pip pynacl

      - name: Run Instagram token refresh & secret maintenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_SECRETS_WRITE_TOKEN: ${{ secrets.GH_SECRETS_WRITE_TOKEN }}
        run: python refresh_instagram_token.py

      - name: Commit updated token metadata
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "chore: record updated Instagram token metadata [skip ci]" || echo "No metadata changes to commit"
          git push origin main || echo "Push skipped or nothing to push"
