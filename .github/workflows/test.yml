name: NEWS SNAP Automation

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Bypass cadence wait for immediate publication'
        required: false
        default: 'false'
        type: string

concurrency:
  group: news-snap-automation-live
  queue: max


permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  news:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest history and branch state
        run: |
          git pull origin main --rebase || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip Pillow langdetect

      - name: Discover English global news from GDELT
        run: python test.py

      - name: Check for fresh eligible candidates
        id: check-candidates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
          PUBLISH_CADENCE_MINUTES: "25"
        run: python check_candidates.py

      - name: Classify candidates with AI (Cloudflare / Groq / Gemini)
        if: steps.check-candidates.outputs.has_fresh == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: "@cf/zai-org/glm-4.7-flash"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: python classify.py

      - name: Select best article (with duplicate prevention)
        id: select-article
        if: steps.check-candidates.outputs.has_fresh == 'true'
        run: python select_article.py

      - name: Prepare special format data (quote verification / roundup)
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true'
        run: python prepare_special_formats.py

      - name: Generate NEWS SNAP post content
        id: generate-post
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: "@cf/zai-org/glm-4.7-flash"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: |
          rm -f post.json news_snap_post.jpg roundup_post.jpg
          python post_generator.py

      - name: Generate NEWS SNAP image
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true' && steps.generate-post.outputs.post_ready == 'true'
        run: |
          if [ ! -f post.json ]; then
            echo "[FATAL ERROR] post.json missing prior to image generation."
            exit 1
          fi
          python generate_image.py

      - name: Prepare GitHub Pages directory
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true' && steps.generate-post.outputs.post_ready == 'true'
        run: |
          mkdir -p _site
          cp news_snap_post.jpg _site/news_snap_post.jpg
          if [ -f privacy.html ]; then cp privacy.html _site/privacy.html; fi
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>NEWS SNAP — Latest Publication</title>
            <style>
              body { background: #08101c; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
              img { max-width: 100%; max-height: 80vh; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
              h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #ffcf2d; }
              p { color: #8fa0b5; font-size: 0.9rem; }
              a { color: #38bdf8; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>NEWS SNAP — Latest Publication</h1>
            <img src="news_snap_post.jpg" alt="NEWS SNAP Latest Post">
            <p>Automated Instagram publication asset hosted via GitHub Pages.</p>
            <p style="margin-top: 15px;"><a href="privacy.html">Privacy Policy &amp; Data Deletion Instructions</a></p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true' && steps.generate-post.outputs.post_ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true' && steps.generate-post.outputs.post_ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true' && steps.generate-post.outputs.post_ready == 'true'
        id: deploy-pages
        uses: actions/deploy-pages@v4

      - name: Show generated post
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true' && steps.generate-post.outputs.post_ready == 'true'
        run: |
          echo "===== NEWS SNAP POST ====="
          cat post.json

      - name: Verify and publish to Instagram (Dry run by default)
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true' && steps.generate-post.outputs.post_ready == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          ENABLE_INSTAGRAM_POSTING: ${{ vars.ENABLE_INSTAGRAM_POSTING }}
          IMAGE_PUBLIC_URL: ${{ steps.deploy-pages.outputs.page_url }}news_snap_post.jpg
        run: python instagram_publisher.py

      - name: Persist post history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f history.json ]; then
            for attempt in 1 2 3 4 5; do
              git add history.json
              if git diff --staged --quiet; then
                echo "No new history changes to commit."
                break
              fi
              git commit -m "chore: update post history [skip ci]" || true
              if git push origin main; then
                echo "Successfully persisted post history to origin/main on attempt $attempt."
                break
              fi
              echo "Git push rejected on attempt $attempt; pulling latest changes with rebase..."
              git pull origin main --rebase || git rebase --abort || true
              sleep 2
            done
          fi

      - name: Upload NEWS SNAP image artifact
        if: steps.check-candidates.outputs.has_fresh == 'true' && steps.select-article.outputs.article_selected == 'true' && steps.generate-post.outputs.post_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: news-snap-post
          path: |
            news_snap_post.jpg
            post.json
            selected_article.json
            roundup.json
            roundup_post.json
          if-no-files-found: warn

      - name: NEWS SNAP execution summary
        if: always()
        run: python run_summary.py
