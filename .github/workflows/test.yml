name: NEWS SNAP Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          api_key = os.environ["GEMINI_API_KEY"]

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.5-flash-lite:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": "Reply with exactly: NEWS SNAP GEMINI OK"
                          }
                      ]
                  }
              ]
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          text = data["candidates"][0]["content"]["parts"][0]["text"]

          print("Gemini connection successful.")
          print("Gemini response:", text)
          PY

      - name: Collect GDELT discovery
        run: python test.py

      - name: Show discovery summary
        run: |
          python - <<'PY'
          import json

          with open("discovery.json", "r", encoding="utf-8") as f:
              articles = json.load(f)

          print(f"TOTAL ARTICLES: {len(articles)}")
          print("\nFIRST 10 ARTICLES:\n")

          for i, article in enumerate(articles[:10], 1):
              print(f"{i}. {article['title']}")
              print(f"   SOURCE: {article['domain']}")
              print(f"   URL: {article['url']}")
              print()
          PY
