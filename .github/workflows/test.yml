name: NEWS SNAP Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --upgrade pip Pillow

      - name: Collect GDELT discovery
        run: python test.py

      - name: Classify first batch with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python classify.py

      - name: Select one article
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          articles = json.loads(
              Path("discovery.json").read_text(encoding="utf-8")
          )

          result = json.loads(
              Path("classified_sample.json").read_text(encoding="utf-8")
          )

          classifications = {
              item["id"]: item
              for item in result.get("results", [])
          }

          selected = None

          for index, article in enumerate(articles[:50], start=1):
              classification = classifications.get(index)

              if classification and classification.get("importance") == "MAJOR":
                  selected = {
                      **article,
                      "classification": classification
                  }
                  break

          if selected is None:
              for index, article in enumerate(articles[:50], start=1):
                  classification = classifications.get(index)

                  if classification and classification.get("importance") == "NORMAL":
                      selected = {
                          **article,
                          "classification": classification
                      }
                      break

          if selected is None and articles:
              selected = {
                  **articles[0],
                  "classification": classifications.get(1, {})
              }

          if selected is None:
              raise RuntimeError("No article available.")

          Path("selected_article.json").write_text(
              json.dumps(selected, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("SELECTED ARTICLE:")
          print(json.dumps(selected, ensure_ascii=False, indent=2))
          PY

      - name: Generate NEWS SNAP post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python post_generator.py

      - name: Generate NEWS SNAP image
        run: python generate_image.py

      - name: Show generated post
        run: |
          echo "===== NEWS SNAP POST ====="
          cat post.json

      - name: Upload NEWS SNAP image
        uses: actions/upload-artifact@v7
        with:
          name: news-snap-first-post
          path: news_snap_post.jpg
          if-no-files-found: error
