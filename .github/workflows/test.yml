name: NEWS SNAP Automation

on:
  workflow_dispatch:
  schedule:
    # Run every 6 hours to stay comfortably within free-tier API quotas and GitHub Actions limits
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip Pillow langdetect

      - name: Discover English global news from GDELT
        run: python test.py

      - name: Classify candidates with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
        run: python classify.py

      - name: Select best article (with duplicate prevention)
        run: python select_article.py

      - name: Generate NEWS SNAP post content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
        run: python post_generator.py

      - name: Generate NEWS SNAP image
        run: python generate_image.py

      - name: Show generated post
        run: |
          echo "===== NEWS SNAP POST ====="
          cat post.json

      - name: Verify and publish to Instagram (Dry run by default)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          ENABLE_INSTAGRAM_POSTING: ${{ vars.ENABLE_INSTAGRAM_POSTING }}
        run: python instagram_publisher.py

      - name: Persist post history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f history.json ]; then
            git add history.json
            git diff --staged --quiet || (git commit -m "chore: update post history [skip ci]" && git push)
          fi

      - name: Upload NEWS SNAP image artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-snap-post
          path: |
            news_snap_post.jpg
            post.json
            selected_article.json
          if-no-files-found: error
