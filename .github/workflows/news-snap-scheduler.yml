name: NEWS SNAP Scheduler Controller

on:
  workflow_dispatch:
    inputs:
      bootstrap_only:
        description: 'Initialize recurrence chain safely without dispatching production publisher'
        required: false
        default: false
        type: boolean

concurrency:
  group: news-snap-scheduler-controller
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest history and branch state
        run: |
          git pull origin main --rebase || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run scheduler controller cycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          BOOTSTRAP_ONLY: ${{ inputs.bootstrap_only }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: "@cf/zai-org/glm-4.7-flash"
          AI_PROVIDER: "cloudflare"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scheduler_controller.py
